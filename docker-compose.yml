services:
  db:
     image: mariadb:11
     container_name: blog-db
     restart: unless-stopped
     environment:
        MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
        MARIADB_DATABASE: ${DB_NAME}
        MARIADB_USER : ${DB_USER}
        MARIADB_PASSWORD: ${DB_PASSWORD}
     ports:
      - "${DB_PORT}:3306"
     volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: